site_name: TXSeq
site_author: The Kennedy Institute of Rheumatology, NDORMS, University of Oxford
site_dir: public
site_url: ""

#Repository information
repo_name:  sansomlab/txseq_snakemake 
repo_url: https://github.com/sansomlab/txseq_snakemake

nav:
  - Workflow overview: index.md
  - Installation: Installation.md
  - Genomes and Annotations: genomesAndAnnotations.md
  - Building transcriptome indexes: buildingTranscriptomeIndexes.md
  - Configuration files: configuration.md
  - Mouse HSCs example: mouse_hscs_example.md

theme:
  name: material
  logo: images/sansomlab_logo.png
  favicon: images/sansomlab_logo.png 
   # 404 page
  static_templates:
    - 404.html

  palette:

  # Palette toggle for automatic mode
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
    primary: custom

  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom


    toggle:
      icon: material/brightness-7
      name: Switch to dark mode

  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to system preference
    primary: custom
  
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate


  # Necessary for search to work properly
  include_search_page: false
  search_index_only: true

  # Default values, taken from mkdocs_theme.yml
  language: en
  font:
    text: Mukta
    code: Fira Code

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.blocks.caption

plugins: 
  - glightbox:
      effect: zoom
      zoomable: true
  - search:
      lang: en
  - table-reader

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright : 

extra_css:
  - stylesheets/extra.css
  - stylesheets/cards.css
  - stylesheets/colors.css
  - stylesheets/side_bar_menu.css
  - stylesheets/code_block_colour_nord.css
  - stylesheets/gradient_peek.css


