# pipeline_preprocess_quantseq_fwd.py configuration file
# =======================================
#

# The libraries.tsv file- see config docs
libraries: ~/path/to/libraries.tsv

# Trim reads?
# Either "False"
# or the desired length of the read. Bases will be trimmed from the 3' end.
trim: False

resources:
    threads: 1
    mem_mb: 1000
    runtime: 60

# Slurm settings applied to every job submitted by this workflow.
# The account is mandatory: set it to a Slurm account you are associated with
# (list them with: sacctmgr -nP show assoc user=$USER format=Account).
slurm:
    account: slurm_account
    partition: short
