# Pipeline hisat.smk configuration file
rundir: 

# path to the sample table
samples: ./path/to/samples.tsv

# Path to the table of sequencing libraries 
libraries: ./path/to/libraries.tsv
#path to fq files
fq_dir:

paired: #True or false
strand: #forward, reverse or none


txseq:
  # Path to the location where the "txseq ensembl" pipeline was run
  # to generate the sanitised genome, transcript fasta and gtf files 
  #
  # If working on the KIR BMRC space, use e.g.
  #       for human: /well/kir/mirror/txseq/GRCh38.115.dir/ensembl/ensembl.dir
  #       for mouse: /well/kir/mirror/txseq/GRCm39.110.dir/ensembl.dir
  #
  # For the mouse_hscs example, set to 
  #       /my/path/to/GRCm39.110.dir/ensembl.dir
  #
   annotations:
  
  # Path to the location where the "txseq hisat_index" pipeline was run
  # to generate the hisat index
  #
  # If working on the KIR BMRC space, use e.g.
  #       for human: /well/kir/mirror/txseq/GRCh38.115.dir/hisat_index/genome_tran
  #       for mouse: /well/kir/mirror/txseq/GRCm39.110.dir/hisat.index.dir/genome_tran
  #
   # For the mouse_hscs example, set to 
  #       /my/path/to/GRCm39.110.dir/hisat.index.dir/genome_tran
  #
   hisat_index:

hisat:  
  # hisat2 options
  options: --dta --score-min L,0.0,-0.2

resources:
    threads: 8
    mem_mb: 15000
    runtime: 300

# Slurm settings applied to every job submitted by this workflow.
# The account is mandatory: set it to a Slurm account you are associated with
# (list them with: sacctmgr -nP show assoc user=$USER format=Account).
slurm:
    account: slurm_account
    partition: short
