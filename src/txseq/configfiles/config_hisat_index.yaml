# hisat_index.smk configuration file
# ==========================================
#
rundir:
# see: http://daehwankimlab.github.io/hisat2/howto/#build-hgfm-index-with-transcripts
# this pipeline will build a HGFM index with transcripts
#
# The txseq sanitised ensembl primary assembly
#
# If working on the KIR BMRC space, use e.g. 
#       for human: /well/kir/mirror/txseq/GRCh38.115.dir/ensembl/ensembl.dir/api.dir/txseq.genome.fa.gz
#       for mouse: /well/kir/mirror/txseq/GRCm39.110.dir/ensembl.dir/api.dir/txseq.genome.fa.gz
#
# For the mouse_hscs example, set to 
#       /my/path/to/GRCm39.110.dir/ensembl.dir/api.dir/txseq.genome.fa.gz
#
primary_assembly: 

# The txseq sanitised ensembl GTF genset
#
# If working on the KIR BMRC space, use e.g. 
#       e.g. human: /users/sansom/wrf380/devel/txseq_ensembl_115_for_mirror/ensembl.dir/api.dir/txseq.geneset.gtf.gz
#       e.g. mouse: /well/kir/mirror/txseq/GRCm39.110.dir/ensembl.dir/api.dir/txseq.geneset.gtf.gz
#
# For the mouse_hscs example, set to 
#       /my/path/to/GRCm39.110.dir/ensembl.dir/api.dir/txseq.geneset.fa.gz
#
geneset: 


KkmerLen: 31

  
index_memory: 180000
index_threads: 4
index_runtime: 300

# resource allocation
resources:
    threads: 1
    mem_mb: 1500
    runtime: 60

# Slurm settings applied to every job submitted by this workflow.
# The account is mandatory: set it to a Slurm account you are associated with
# (list them with: sacctmgr -nP show assoc user=$USER format=Account).
slurm:
    account: slurm_account
    partition: short
