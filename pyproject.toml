[project]
name = "txseq"
version = "0.1.0"
description = "Snakemake workflows for computational analysis of transcriptome sequencing data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Tarrion Baird" },
    { name = "Sansom lab", email = "stephen.sansom@kennedy.ox.ac.uk" },
]

dependencies = [
    "apsw",
    "biopython",
    "numpy",
    "pandas",
    "PyYAML",
    "rich-argparse",
    "snakemake>=9",
    "snakemake-executor-plugin-slurm",
    "sqlalchemy",
]

[project.scripts]
txseq = "txseq.cli:main"

[project.urls]
Repository = "https://github.com/sansomlab/txseq_snakemake"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txseq"]
